<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emby Keeper</title>
  <script>
    (function () {
      const path = window.location.pathname.replace(/\/$/, '');
      const routeSuffix = /(?:\/(?:login|schedule|runs|config|registrar)(?:\/.*)?|\/servers(?:\/.*)?)$/;
      const basePath = path.replace(routeSuffix, '');
      window.EK_BASE_PATH = basePath === '/' ? '' : basePath;
      window.EK_STATIC_PATH = `${window.EK_BASE_PATH}/static/`;
      window.EK_VENDOR_PATH = `${window.EK_BASE_PATH}/static/vendor/`;
      window.EK_CDN_ORIGIN = 'https://cdn.jsdelivr.net';
      window.EK_LOAD_STATIC = function (filename) {
        document.write(`<script src="${window.EK_STATIC_PATH}${filename}"><\/script>`);
      };
      window.EK_LOAD_VENDOR = function (filename) {
        document.write(`<script src="${window.EK_VENDOR_PATH}${filename}"><\/script>`);
      };
      window.EK_LOAD_CDN = function (origin, path) {
        document.write(`<script src="${origin}${path}"><\/script>`);
      };
      window.EK_SYNC_NAIVE = function () {
        if (typeof naive !== 'undefined' && typeof naiveUI === 'undefined') window.naiveUI = naive;
      };
    }());
  </script>
  <script>window.EK_LOAD_VENDOR('vue.global.prod.js')</script>
  <script>if(typeof Vue==='undefined'){window.EK_LOAD_CDN(window.EK_CDN_ORIGIN,'/npm/vue@3/dist/vue.global.prod.js')}</script>
  <script>window.EK_LOAD_VENDOR('naive-ui.prod.js')</script>
  <script>window.EK_SYNC_NAIVE();if(typeof naiveUI==='undefined'){window.EK_LOAD_CDN(window.EK_CDN_ORIGIN,'/npm/naive-ui@2/dist/index.prod.js')}</script>
  <script>window.EK_SYNC_NAIVE()</script>
  <script>window.EK_LOAD_VENDOR('vue-router.global.prod.js')</script>
  <script>if(typeof VueRouter==='undefined'){window.EK_LOAD_CDN(window.EK_CDN_ORIGIN,'/npm/vue-router@4/dist/vue-router.global.prod.js')}</script>
  <script>document.write(`<link rel="stylesheet" href="${window.EK_STATIC_PATH}app-style.css" />`)</script>
  <script>window.EK_LOAD_STATIC('app-core.js')</script>
</head>
<body>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;">
      <h2>需要启用 JavaScript</h2>
      <p>Emby Keeper Web UI 需要 JavaScript 才能运行。请启用后刷新页面。</p>
    </div>
  </noscript>
  <div id="cdn-fallback" style="display:none;padding:40px;max-width:600px;margin:60px auto;font-family:sans-serif;background:#fff3f0;border:1px solid #ffccc7;border-radius:8px;">
    <h2 style="color:#cf1322;margin-bottom:12px;">前端资源加载失败</h2>
    <p style="margin-bottom:8px;">无法加载 Vue / Naive UI / Vue Router。可能的原因：</p>
    <ul style="margin-left:20px;line-height:1.8;">
      <li>网络环境无法访问 cdn.jsdelivr.net</li>
      <li>浏览器或代理拦截了脚本</li>
      <li>CDN 临时故障</li>
    </ul>
    <p style="margin-top:12px;">请检查浏览器控制台 (F12) 获取详细错误，或尝试切换网络后刷新。</p>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (typeof Vue === 'undefined' || typeof naiveUI === 'undefined' || typeof VueRouter === 'undefined') {
        document.getElementById('cdn-fallback').style.display = 'block';
        var app = document.getElementById('app');
        if (app) app.style.display = 'none';
      }
    });
  </script>
  <div id="app"></div>

  <script>
    const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
    const {
      NConfigProvider, NMessageProvider, NNotificationProvider, NDialogProvider,
      NCard, NButton, NSpace, NInput, NForm, NFormItem, NSelect, NSwitch,
      NDataTable, NTag, NModal, NTabs, NTabPane, NDescriptions, NDescriptionsItem,
      NGrid, NGi, NLayout, NLayoutHeader, NLayoutContent, NLayoutFooter,
      NSpin, NResult, NEmpty, NDivider, NAlert, NInputNumber, NPopconfirm,
      NDatePicker, NTimePicker, NIcon, NText, NAvatar, NBadge, NStatistic,
      NProgress, NTooltip, useMessage, useNotification, useDialog,
      zhCN, dateZhCN
    } = naiveUI;

    // ============ Auth Guard Component ============
    const AuthGuard = {
      setup() {
        const router = VueRouter.useRouter();
        onMounted(() => {
          const token = sessionStorage.getItem('ek_jwt');
          if (!token) {
            router.replace('/login');
          }
        });
      },
      render() { return null; }
    };

    // ============ Login Page ============
    const LoginPage = {
      components: { NCard, NButton, NSpace, NInput, NTabs, NTabPane, NAlert, NIcon },
      template: `
        <div class="login-container">
          <n-card class="login-card" title="Emby Keeper" :bordered="false">
            <template #header-extra>
              <n-text style="font-size:12px;color:#999">v0.1.0</n-text>
            </template>
            <n-alert v-if="errorMsg" type="error" :bordered="false" style="margin-bottom:16px">{{ errorMsg }}</n-alert>
            <n-spin :show="loadingMethods">
              <n-alert v-if="authMethodsLoaded && !hasAuthMethod" type="warning" :bordered="false">
                当前服务未配置 WebUI 登录方式。请设置 EK_TOKEN 或 EK_WEBPASS 后重启服务。
              </n-alert>
              <n-tabs v-else v-model:value="activeTab" type="segment" animated>
                <n-tab-pane v-if="hasToken" name="token" tab="Token 登录">
                  <n-space vertical :size="16">
                    <n-input v-model:value="tokenInput" type="password" show-password-on="click" placeholder="请输入预共享 Token" @keyup.enter="handleTokenLogin" />
                    <n-button type="primary" block :loading="loading" :disabled="!tokenInput.trim()" @click="handleTokenLogin">登录</n-button>
                  </n-space>
                </n-tab-pane>
                <n-tab-pane v-if="hasPassword" name="password" tab="密码登录">
                  <n-space vertical :size="16">
                    <n-input v-model:value="passwordInput" type="password" show-password-on="click" placeholder="请输入管理密码" @keyup.enter="handlePasswordLogin" />
                    <n-button type="primary" block :loading="loading" :disabled="!passwordInput.trim()" @click="handlePasswordLogin">登录</n-button>
                  </n-space>
                </n-tab-pane>
              </n-tabs>
            </n-spin>
          </n-card>
        </div>
      `,
      setup() {
        const router = VueRouter.useRouter();
        const message = useMessage();
        const activeTab = ref('token');
        const tokenInput = ref('');
        const passwordInput = ref('');
        const loading = ref(false);
        const loadingMethods = ref(true);
        const authMethodsLoaded = ref(false);
        const errorMsg = ref('');
        const hasToken = ref(false);
        const hasPassword = ref(false);
        const hasAuthMethod = computed(() => hasToken.value || hasPassword.value);

        onMounted(async () => {
          try {
            const methods = await API.authMethods();
            hasToken.value = methods.token;
            hasPassword.value = methods.password;
            if (methods.token) activeTab.value = 'token';
            else if (methods.password) activeTab.value = 'password';
          } catch (e) {
            errorMsg.value = e.message;
          } finally {
            authMethodsLoaded.value = true;
            loadingMethods.value = false;
          }
        });

        async function handleTokenLogin() {
          if (!tokenInput.value.trim()) return;
          loading.value = true; errorMsg.value = '';
          try {
            const res = await API.tokenExchange(tokenInput.value.trim());
            sessionStorage.setItem('ek_jwt', res.access_token);
            message.success('登录成功');
            router.replace('/');
          } catch (e) { errorMsg.value = e.message; }
          finally { loading.value = false; }
        }

        async function handlePasswordLogin() {
          if (!passwordInput.value.trim()) return;
          loading.value = true; errorMsg.value = '';
          try {
            const res = await API.passwordLogin(passwordInput.value.trim());
            sessionStorage.setItem('ek_jwt', res.access_token);
            message.success('登录成功');
            router.replace('/');
          } catch (e) { errorMsg.value = e.message; }
          finally { loading.value = false; }
        }

        return {
          activeTab, tokenInput, passwordInput, loading, loadingMethods, authMethodsLoaded,
          errorMsg, hasToken, hasPassword, hasAuthMethod, handleTokenLogin, handlePasswordLogin
        };
      }
    };

    // ============ Dashboard Page ============
    const DashboardPage = {
      components: { NCard, NButton, NSpace, NGrid, NGi, NStatistic, NTag, NEmpty, NSpin, NPopconfirm, NTooltip, NIcon, NBadge, NAvatar, NText },
      template: `
        <div class="page-container">
          <div class="page-header">
            <div>
              <div class="page-kicker">概览</div>
              <h1 class="page-title">仪表盘 / 服务器列表</h1>
              <p class="page-subtitle">服务健康、账号数量、运行任务、最近运行结果和下一次调度集中在这里。</p>
            </div>
            <div class="page-actions">
              <n-button @click="refreshDataAndPoll">刷新</n-button>
              <n-button type="primary" @click="$router.push('/servers/new')">添加服务器</n-button>
              <n-popconfirm @positive-click="handleWatchAll">
                <template #trigger><n-button :loading="watchAllLoading">全部保活</n-button></template>
                确定要对所有已启用服务器执行保活吗？
              </n-popconfirm>
            </div>
          </div>

          <n-grid cols="1 s:2 m:4" responsive="screen" :x-gap="12" :y-gap="12" style="margin-bottom:16px">
            <n-gi>
              <div class="metric-card">
                <span class="metric-label">服务器总数</span>
                <strong class="metric-value">{{ status.total_servers }}</strong>
                <span class="metric-note">启用 {{ status.enabled_servers }}</span>
              </div>
            </n-gi>
            <n-gi>
              <div class="metric-card">
                <span class="metric-label">在线账号</span>
                <strong class="metric-value">{{ status.online_servers }}</strong>
                <span class="metric-note">{{ onlineRate }}</span>
              </div>
            </n-gi>
            <n-gi>
              <div class="metric-card">
                <span class="metric-label">运行任务</span>
                <strong class="metric-value">{{ status.running_servers }}</strong>
                <span class="metric-note">{{ runningSummary }}</span>
              </div>
            </n-gi>
            <n-gi>
              <div class="metric-card">
                <span class="metric-label">下一次调度</span>
                <strong class="metric-value" style="font-size:18px">{{ nextScheduleLabel }}</strong>
                <span class="metric-note">{{ nextScheduleAccount }}</span>
              </div>
            </n-gi>
          </n-grid>

          <div class="panel">
            <div class="panel-header">
              <div>
                <div class="panel-title">运行健康</div>
                <div class="panel-desc">来自 GET /api/status/health</div>
              </div>
              <n-tag :type="healthData && healthData.status === 'ok' ? 'success' : 'warning'" size="small">
                {{ healthData ? healthData.status : 'loading' }}
              </n-tag>
            </div>
            <div class="health-strip">
              <div class="health-item">
                <span class="health-label">调度器</span>
                <span class="health-value">
                  <span class="status-dot" :class="healthData && healthData.scheduler_initialized ? 'online' : 'offline'" />
                  {{ healthData && healthData.scheduler_initialized ? '已初始化' : '未初始化' }}
                </span>
              </div>
              <div class="health-item">
                <span class="health-label">通知</span>
                <span class="health-value">
                  <span class="status-dot" :class="healthData && healthData.notifier_ready ? 'online' : (healthData && healthData.notifier_configured ? 'running' : 'unknown')" />
                  {{ notifierSummary }}
                </span>
              </div>
              <div class="health-item">
                <span class="health-label">最近运行</span>
                <span class="health-value">{{ latestRunSummary }}</span>
              </div>
              <div class="health-item">
                <span class="health-label">最近保活</span>
                <span class="health-value">{{ formatDate(status.last_global_watch_time) }}</span>
              </div>
            </div>
          </div>

          <div class="dashboard-toolbar">
            <n-text class="section-title">服务器列表</n-text>
            <n-space class="dashboard-actions">
              <n-button size="small" @click="$router.push('/schedule')">查看调度</n-button>
              <n-button size="small" @click="$router.push('/runs')">运行日志</n-button>
            </n-space>
          </div>

          <n-spin :show="loading">
            <div v-if="servers.length === 0" class="empty-state">
              <n-empty description="暂无服务器，点击添加服务器开始" />
            </div>
            <div v-else class="server-grid">
              <n-card v-for="s in servers" :key="s.id" class="server-card" size="small" hoverable @click="$router.push('/servers/' + API.encodeId(s.id))">
                <template #header>
                  <n-space align="center" :size="8" style="min-width:0">
                    <span class="status-dot" :class="s.is_running ? 'running' : (s.is_online ? 'online' : (s.is_online === false ? 'offline' : 'unknown'))" />
                    <span class="truncate-text">{{ s.name || s.id }}</span>
                  </n-space>
                </template>
                <template #header-extra>
                  <n-tag :type="s.enabled ? 'success' : 'default'" size="small">{{ s.enabled ? '启用' : '禁用' }}</n-tag>
                </template>
                <n-space vertical :size="8">
                  <n-text class="truncate-text" depth="3">{{ s.url }}</n-text>
                  <div class="server-meta">
                    <span class="server-meta-item truncate-text">用户: {{ s.username }}</span>
                    <span class="server-meta-item truncate-text">下次: {{ formatDate(s.next_schedule_time) }}</span>
                    <span class="server-meta-item truncate-text">上次保活: {{ formatDate(s.last_watch_time) }}</span>
                    <span class="server-meta-item truncate-text">结果: {{ s.last_watch_status || '-' }}</span>
                  </div>
                  <n-space :size="8">
                    <n-tag :type="s.has_token ? 'info' : 'warning'" size="small">{{ s.has_token ? 'Token 已配置' : '未配置认证' }}</n-tag>
                    <n-tag v-if="s.is_running" type="warning" size="small">运行中</n-tag>
                  </n-space>
                </n-space>
                <template #action>
                  <n-space class="card-actions">
                    <n-button size="small" @click.stop="handleLogin(s.id)" :loading="actionLoading[s.id]">登录测试</n-button>
                    <n-button size="small" type="primary" @click.stop="handleWatch(s.id)" :loading="actionLoading[s.id+'-w']">保活</n-button>
                    <n-button v-if="s.is_running" size="small" type="warning" @click.stop="handleCancel(s.id)" :loading="actionLoading[s.id+'-c']">取消任务</n-button>
                  </n-space>
                </template>
              </n-card>
            </div>
          </n-spin>
        </div>
      `,
      setup() {
        const message = useMessage();
        const servers = ref([]);
        const schedules = ref([]);
        const healthData = ref(null);
        const status = reactive({ total_servers: 0, enabled_servers: 0, online_servers: 0, running_servers: 0, last_global_watch_time: null });
        const loading = ref(true);
        const watchAllLoading = ref(false);
        const actionLoading = reactive({});
        let pollTimer = null;
        let disposed = false;

        const nextSchedule = computed(() => {
          const candidates = schedules.value
            .filter((item) => item.enabled !== false && item.next_time)
            .map((item) => ({ item, time: new Date(item.next_time).getTime() }))
            .filter((entry) => Number.isFinite(entry.time))
            .sort((a, b) => a.time - b.time);
          return candidates.length ? candidates[0].item : null;
        });
        const nextScheduleLabel = computed(() => nextSchedule.value ? formatDate(nextSchedule.value.next_time) : '-');
        const nextScheduleAccount = computed(() => nextSchedule.value ? nextSchedule.value.account_spec : '无计划任务');
        const onlineRate = computed(() => {
          if (!status.total_servers) return '暂无账号';
          return `${Math.round((status.online_servers / status.total_servers) * 100)}% 在线`;
        });
        const runningSummary = computed(() => status.running_servers ? '需要关注任务进度' : '当前空闲');
        const latestRunSummary = computed(() => {
          if (!healthData.value || !healthData.value.latest_run_id) return '-';
          return `${healthData.value.latest_run_status || 'unknown'} / ${healthData.value.latest_run_id}`;
        });
        const notifierSummary = computed(() => {
          if (!healthData.value) return '-';
          if (healthData.value.notifier_ready) return '已就绪';
          if (healthData.value.notifier_configured) return '已配置';
          return '未配置';
        });

        function formatDate(value) {
          return value ? new Date(value).toLocaleString() : '-';
        }

        async function loadData() {
          try {
            const [serverList, statusData, health, scheduleList] = await Promise.all([
              API.listServers(),
              API.getStatus(),
              API.getHealth(),
              API.getSchedule(),
            ]);
            servers.value = serverList;
            schedules.value = scheduleList;
            healthData.value = health;
            Object.assign(status, statusData);
          } catch (e) { message.error(e.message); }
          finally { loading.value = false; }
        }

        function refreshPoll() {
          if (disposed) return;
          if (pollTimer) clearTimeout(pollTimer);
          const hasRunning = servers.value.some((server) => server.is_running);
          pollTimer = setTimeout(async () => {
            await loadData();
            if (!disposed) refreshPoll();
          }, hasRunning ? 5000 : 30000);
        }

        async function refreshDataAndPoll() {
          await loadData();
          refreshPoll();
        }

        async function handleLogin(id) {
          await runUiAction({
            setLoading: (value) => { actionLoading[id] = value; },
            action: () => API.triggerLogin(id),
            message,
            success: (res) => responseMessage(res, '登录测试已触发'),
            refresh: refreshDataAndPoll,
          });
        }

        async function handleWatch(id) {
          await runUiAction({
            setLoading: (value) => { actionLoading[id + '-w'] = value; },
            action: () => API.triggerWatch(id),
            message,
            success: (res) => responseMessage(res, '保活任务已启动'),
            refresh: refreshDataAndPoll,
          });
        }

        async function handleCancel(id) {
          await runUiAction({
            setLoading: (value) => { actionLoading[id + '-c'] = value; },
            action: () => API.cancelWatch(id),
            message,
            success: '已请求取消任务',
            refresh: refreshDataAndPoll,
          });
        }

        async function handleWatchAll() {
          await runUiAction({
            setLoading: (value) => { watchAllLoading.value = value; },
            action: () => API.watchAll(),
            message,
            success: (res) => responseMessage(res, '全部保活任务已启动'),
            refresh: refreshDataAndPoll,
          });
        }

        onMounted(async () => {
          disposed = false;
          await loadData();
          refreshPoll();
        });
        onUnmounted(() => {
          disposed = true;
          if (pollTimer) clearTimeout(pollTimer);
        });

        return {
          API, servers, schedules, healthData, status, loading, watchAllLoading, actionLoading,
          nextScheduleLabel, nextScheduleAccount, onlineRate, runningSummary, latestRunSummary,
          notifierSummary, formatDate, refreshDataAndPoll, handleLogin, handleWatch, handleCancel, handleWatchAll
        };
      }
    };

    // ============ Server Form Page (Add/Edit) ============
    const ServerFormPage = {
      components: { NCard, NButton, NSpace, NInput, NForm, NFormItem, NSwitch, NSelect, NInputNumber, NAlert, NDivider, NText },
      template: `
        <div class="page-container">
          <n-card :title="isEdit ? '编辑服务器' : '添加服务器'">
            <template #header-extra>
              <n-button text @click="$router.back()">返回</n-button>
            </template>
            <n-alert v-if="errorMsg" type="error" :bordered="false" style="margin-bottom:16px">{{ errorMsg }}</n-alert>

            <div class="form-section-title">认证方式</div>
            <n-space vertical :size="12" style="margin-bottom:12px">
              <n-select v-model:value="form.auth_method" :options="authOptions" />
              <n-alert v-if="form.auth_method === 'token'" type="success" :bordered="false">
                推荐：直接提供 AccessToken，更安全，无需密码
              </n-alert>
              <n-alert v-if="form.auth_method === 'password'" type="warning" :bordered="false">
                密码仅用于一次性换取 Token，不会被保存。登录成功后密码立即丢弃
              </n-alert>
              <n-input v-if="form.auth_method === 'token'" v-model:value="form.access_token" type="password" show-password-on="click" placeholder="请输入 AccessToken" />
              <n-input v-if="form.auth_method === 'password'" v-model:value="form.password" type="password" show-password-on="click" placeholder="请输入密码（一次性使用）" />
            </n-space>

            <div class="form-section-title">基本信息</div>
            <n-space vertical :size="12">
              <n-input v-model:value="form.url" placeholder="Emby 服务器地址 (如 https://emby.example.com:8096)" />
              <n-input v-model:value="form.username" placeholder="用户名" />
              <n-input v-model:value="form.name" placeholder="显示名称（可选）" />
              <n-switch v-model:value="form.enabled"><template #checked>启用</template><template #unchecked>禁用</template></n-switch>
            </n-space>

            <div class="form-section-title">保活设置</div>
            <n-space vertical :size="12">
              <n-space :size="12" align="center">
                <n-input-number v-model:value="form.time_min" :min="60" :step="60" :precision="0" placeholder="最小秒数" style="width:120px" />
                <n-text>至</n-text>
                <n-input-number v-model:value="form.time_max" :min="60" :step="60" :precision="0" placeholder="最大秒数" style="width:120px" />
                <n-text>秒</n-text>
              </n-space>
              <n-switch v-model:value="form.allow_multiple"><template #checked>允许多视频播放</template><template #unchecked>仅单视频</template></n-switch>
              <n-switch v-model:value="form.allow_stream"><template #checked>允许无时长流播放</template><template #unchecked>需时长信息</template></n-switch>
            </n-space>

            <div class="form-section-title">调度设置</div>
            <n-space vertical :size="12">
              <n-input v-model:value="form.interval_days" placeholder="保活间隔天数 (如 7,12 或 7)" />
              <n-input v-model:value="form.time_range" placeholder="保活时间范围 (如 11:00AM,11:00PM)" />
            </n-space>

            <div class="form-section-title">高级设置</div>
            <n-space vertical :size="12">
              <n-switch v-model:value="form.use_proxy"><template #checked>使用代理</template><template #unchecked>不使用代理</template></n-switch>
              <n-input v-model:value="form.play_id" placeholder="指定视频 ID（可选）" />
              <n-input v-model:value="form.useragent" placeholder="User-Agent（可选）" />
              <n-input v-model:value="form.client" placeholder="客户端名称（可选）" />
              <n-input v-model:value="form.client_version" placeholder="客户端版本（可选）" />

        </div>
      `,
      setup() {
        const router = VueRouter.useRouter();
        const route = VueRouter.useRoute();
        const message = useMessage();
        const isEdit = computed(() => route.params.id && route.params.id !== 'new');
        const saving = ref(false);
        const errorMsg = ref('');
        const originalAuthMethod = ref(null);

        const authOptions = [

          { label: '密码（一次性换取 Token）', value: 'password' },
        ];

        const form = reactive({
          url: '', username: '', name: '', auth_method: 'token',
          access_token: '', password: '',
          time_min: 300, time_max: 600,
          allow_multiple: true, allow_stream: false, use_proxy: true,
          enabled: true, play_id: '',
          interval_days: '', time_range: '',
          useragent: '', client: '', client_version: '', device: '', device_id: '',
        });

        onMounted(async () => {
          if (isEdit.value) {
            try {
              const server = await API.getServer(route.params.id);
              form.url = server.url;
              form.username = server.username;
              form.name = server.name || '';
              form.auth_method = server.auth_method || 'token';
              originalAuthMethod.value = form.auth_method;
              form.enabled = server.enabled;
              form.allow_multiple = server.allow_multiple;
              form.allow_stream = server.allow_stream;
              form.use_proxy = server.use_proxy;
              form.play_id = server.play_id || '';
              form.interval_days = server.interval_days || '';
              form.time_range = server.time_range || '';
              form.useragent = server.useragent || '';
              form.client = server.client || '';
              form.client_version = server.client_version || '';
              form.device = server.device || '';
              form.device_id = server.device_id || '';
              if (Array.isArray(server.time)) {
                form.time_min = server.time[0] || 300;
                form.time_max = server.time[1] || 600;
              } else {
                form.time_min = server.time || 300;
                form.time_max = server.time || 300;
              }
            } catch (e) { message.error(e.message); router.replace('/'); }
          }
        });

        function trimText(value) {
          return typeof value === 'string' ? value.trim() : value;
        }

        function optionalText(value) {
          const trimmed = trimText(value);
          return trimmed || null;
        }

        function isValidWatchTime(value) {
          return Number.isInteger(value) && value >= 60;
        }

        async function handleSave() {
          saving.value = true; errorMsg.value = '';
          const normalized = {
            url: trimText(form.url),
            username: trimText(form.username),
            name: optionalText(form.name),
            access_token: trimText(form.access_token),
            password: trimText(form.password),
            play_id: optionalText(form.play_id),
            interval_days: optionalText(form.interval_days),
            time_range: optionalText(form.time_range),
            useragent: optionalText(form.useragent),
            client: optionalText(form.client),
            client_version: optionalText(form.client_version),
            device: optionalText(form.device),
            device_id: optionalText(form.device_id),
          };
          if (!normalized.url || !normalized.username) {
            errorMsg.value = '服务器地址和用户名不能为空';
            saving.value = false;
            return;
          }
          if (!isValidWatchTime(form.time_min) || !isValidWatchTime(form.time_max)) {
            errorMsg.value = '播放时长必须是至少 60 秒的整数';
            saving.value = false;
            return;
          }
          if (form.time_min > form.time_max) {
            errorMsg.value = '最小播放时长不能大于最大播放时长';
            saving.value = false;
            return;
          }
          const authChanged = isEdit.value && originalAuthMethod.value && form.auth_method !== originalAuthMethod.value;
          if (form.auth_method === 'token' && !normalized.access_token && (!isEdit.value || authChanged)) {
            errorMsg.value = 'Token 模式下必须提供 AccessToken';
            saving.value = false;
            return;
          }
          if (form.auth_method === 'password' && !normalized.password && (!isEdit.value || authChanged)) {
            errorMsg.value = '密码模式下必须提供密码';
            saving.value = false;
            return;
          }
          const watchTime = form.time_min === form.time_max ? form.time_min : [form.time_min, form.time_max];
          const data = {
            url: normalized.url,
            username: normalized.username,
            name: normalized.name,
            auth_method: form.auth_method,
            time: watchTime,
            allow_multiple: form.allow_multiple,
            allow_stream: form.allow_stream,
            use_proxy: form.use_proxy,
            enabled: form.enabled,
            play_id: normalized.play_id,
            interval_days: normalized.interval_days,
            time_range: normalized.time_range,
            useragent: normalized.useragent,
            client: normalized.client,
            client_version: normalized.client_version,
            device: normalized.device,
            device_id: normalized.device_id,
          };
          if (form.auth_method === 'token' && normalized.access_token) {
            data.access_token = normalized.access_token;
          }
          if (form.auth_method === 'password' && normalized.password) {
            data.password = normalized.password;
          }
          try {
            if (isEdit.value) {
              await API.updateServer(route.params.id, data);
              message.success('服务器已更新');
            } else {
              await API.createServer(data);
              message.success('服务器已创建');
            }
            router.replace('/');
          } catch (e) { errorMsg.value = e.message; }
          finally { saving.value = false; }
        }

        return { form, isEdit, saving, errorMsg, authOptions, handleSave };
      }

    // ============ Server Detail Page ============

                <n-descriptions-item label="播放时长">

                <n-descriptions-item label="设备名称">{{ server.device || '默认' }}</n-descriptions-item>

              <n-space justify="center" :size="12">

            </n-card>
          </n-spin>
        </div>
      `,
      setup() {

        async function loadData() {
          try {
            server.value = await API.getServer(route.params.id);
          } catch (e) { message.error(e.message); router.replace('/'); }
          finally { loading.value = false; }
        }

        async function handleWatch() {
          actionLoading.watch = true;
          try {
            const res = await API.triggerWatch(route.params.id);
            message.success(res && res.message ? res.message : '保活已启动');
            await loadData();
          }
          catch (e) { message.error(e.message); }
          finally { actionLoading.watch = false; }
        }

        async function handleLogin() {
          actionLoading.login = true;
          try {
            const res = await API.triggerLogin(route.params.id);
            message.success(res.message || '登录测试已完成');
            await loadData();
          }
          catch (e) { message.error(e.message); }
          finally { actionLoading.login = false; }
        }

        async function handleCancel() {
          actionLoading.cancel = true;
          try {
            await API.cancelWatch(route.params.id);
            message.success('已请求取消任务');
            await loadData();
          } catch (e) { message.error(e.message); }
          finally { actionLoading.cancel = false; }
        }

        async function handleToggle(enabled) {
          try {
            await API.toggleServer(route.params.id, enabled);
            message.success(enabled ? '已启用' : '已禁用');

        async function handleDelete() {

            message.success('服务器已删除');
            router.replace('/');
          } catch (e) { message.error(e.message); }

        onMounted(loadData);
        return { API, server, loading, actionLoading, handleWatch, handleLogin, handleCancel, handleToggle, handleDelete };

                <div class="panel-title">运行列表</div>
                <div class="panel-desc">最近任务默认加载 50 条，可继续加载更多。</div>
              </div>
            </div>

              <div v-if="runs.length" class="data-table-wrap">

              textarea.select();

        onMounted(loadData);
        return { runs, loading, loadingMore, cleanupLoading, statusFilter, statusOptions, cleanupDays, hasMore, columns, logModalVisible, logLoading, selectedRunId, runLogs, logLevelFilter, logLevelOptions, filteredRunLogs, errorLogs, loadData, loadMore, handleCleanup, openRunLogs, copyRunLogs, copyErrorLogs, formatDate };

        async function handleRunNow(id) {
          try {

            message.success(res && res.message ? res.message : '任务已启动');
            await loadData();
          } catch (e) { message.error(e.message); }

            await API.cancelSchedule(id);

            await loadData();

        function optionalText(value) {
          const trimmed = typeof value === 'string' ? value.trim() : value;

          return new Date(value).toLocaleString();

      setup() {
        const message = useMessage();
        const accounts = ref([]);
        const loading = ref(true);
        const submitting = ref(false);
        const canceling = ref(false);
        const lastRun = ref(null);
        const runStatus = ref('');
        const runStatusInfo = ref('');
        const isCompact = ref(window.innerWidth < 760);
        const accountSelectionTouched = ref(false);
        let pollTimer = null;
        const botUsernamePattern = /^[A-Za-z][A-Za-z0-9_]{4,31}$/;
        const form = reactive({
          telegram_account_ids: [],
          bot_username: '',
          username: '',
          password: '',
          interval_seconds: 1,
          timeout_minutes: 30,
        });

        const enabledAccountCount = computed(() => accounts.value.filter((account) => account.enabled).length);
        const selectedAccountCount = computed(() => form.telegram_account_ids.length);
        const botPreview = computed(() => normalizeBot(form.bot_username));
        const accountOptions = computed(() => accounts.value.map((account) => ({
          label: `${account.phone_masked}${account.enabled ? '' : '（禁用）'}${account.registrar ? '' : ' / 未设定时抢注'}`,
          value: account.id,
          disabled: !account.enabled,
        })));
        const canSubmit = computed(() => {
          const username = trimText(form.username);
          const password = trimText(form.password);
          return (
            selectedAccountCount.value > 0
            && isValidBotUsername(botPreview.value)
            && !!username
            && !!password
            && !hasWhitespace(username)
            && !hasWhitespace(password)
            && isIntegerInRange(form.interval_seconds, 1, 60)
            && isIntegerInRange(form.timeout_minutes, 1, 1440)
          );
        });
        const canCancelLastRun = computed(() => ['pending', 'initializing', 'running'].includes(runStatus.value));
        const statusLabels = {
          pending: '等待',
          initializing: '初始化',
          running: '运行中',
          success: '成功',
          fail: '失败',
          error: '错误',
          cancelled: '已取消',
        };
        const runStatusLabel = computed(() => statusLabels[runStatus.value] || runStatus.value || '已启动');
        const runStatusType = computed(() => {
          if (runStatus.value === 'success') return 'success';
          if (runStatus.value === 'fail' || runStatus.value === 'error') return 'error';
          if (runStatus.value === 'cancelled') return 'default';
          return 'warning';
        });
        const runAlertType = computed(() => {
          if (runStatus.value === 'success') return 'success';
          if (runStatus.value === 'fail' || runStatus.value === 'error') return 'error';
          if (canCancelLastRun.value) return 'warning';
          return 'info';
        });

          loading.value = true;
          try {
            accounts.value = await API.listRegistrarAccounts();

              form.telegram_account_ids = enabledAccountIds();
            }

          finally { loading.value = false; }

          return typeof value === 'string' ? value.trim() : value;
        }

        function normalizeBot(value) {
          let bot = trimText(value) || '';
          bot = bot.replace(/^https?:\/\/t\.me\//i, '').split('?', 1)[0].replace(/^@/, '').replace(/\/+$/, '').trim();
          return bot;
        }

        function hasWhitespace(value) {
          return /\s/.test(value || '');
        }

        function isIntegerInRange(value, min, max) {
          return Number.isInteger(value) && value >= min && value <= max;
        }

        function isValidBotUsername(value) {
          return botUsernamePattern.test(value || '');
        }

        function updateCompactState() {
          isCompact.value = window.innerWidth < 760;
        }

        function enabledAccountIds() {
          return accounts.value.filter((account) => account.enabled).map((account) => account.id);
        }

        function normalizeSelectedAccountIds() {
          const enabledIds = new Set(enabledAccountIds());
          form.telegram_account_ids = form.telegram_account_ids.filter((accountId) => enabledIds.has(accountId));
        }

        function handleAccountSelectionChange(value) {
          accountSelectionTouched.value = true;
          form.telegram_account_ids = Array.isArray(value) ? value : [];
          normalizeSelectedAccountIds();
        }

        function selectAllEnabledAccounts() {
          accountSelectionTouched.value = true;
          form.telegram_account_ids = enabledAccountIds();
        }

        function clearSelectedAccounts() {
          accountSelectionTouched.value = true;
          form.telegram_account_ids = [];
        }

        function generatePassword() {
          const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
          form.password = Array.from({ length: 12 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
        }

        function stopRunPolling() {
          if (pollTimer) clearTimeout(pollTimer);
          pollTimer = null;
        }

        async function pollRunStatus() {
          if (!lastRun.value || !lastRun.value.run_id) return;
          stopRunPolling();
          try {
            const run = await API.getRun(lastRun.value.run_id);
            runStatus.value = run.status || '';
            runStatusInfo.value = run.status_info || '';
            if (canCancelLastRun.value) {
              pollTimer = setTimeout(pollRunStatus, 3000);
            } else {
              stopRunPolling();
            }
          } catch (e) {
            stopRunPolling();
          }
        }

        function startRunPolling(initialInfo = '') {
          stopRunPolling();
          runStatus.value = 'running';
          runStatusInfo.value = initialInfo;
          pollTimer = setTimeout(pollRunStatus, 1000);
        }

        async function handleSubmit() {
          const botUsername = normalizeBot(form.bot_username);
          const username = trimText(form.username);
          const password = trimText(form.password);
          if (!form.telegram_account_ids.length) {
            message.error('请选择 Telegram 账号');
            return;
          }
          if (!botUsername || !username || !password) {
            message.error('Bot、注册账号和注册密码不能为空');
            return;
          }
          if (!isValidBotUsername(botUsername)) {
            message.error('Bot 用户名格式不正确');
            return;
          }
          if (hasWhitespace(username) || hasWhitespace(password)) {
            message.error('注册账号和注册密码不能包含空白字符');
            return;
          }
          if (!isIntegerInRange(form.interval_seconds, 1, 60)) {
            message.error('重试间隔必须是 1 到 60 秒之间的整数');
            return;
          }
          if (!isIntegerInRange(form.timeout_minutes, 1, 1440)) {
            message.error('最长运行时间必须是 1 到 1440 分钟之间的整数');
            return;
          }
          submitting.value = true;
          try {
            const res = await API.quickRegister({
              telegram_account_ids: form.telegram_account_ids,
              bot_username: botUsername,
              username,
              password,
              interval_seconds: form.interval_seconds,
              timeout_minutes: form.timeout_minutes,
            });
            lastRun.value = res;
            form.password = '';
            startRunPolling(res && res.message ? res.message : '');
            message.success(res && res.message ? res.message : '抢注任务已启动');
          } catch (e) { message.error(e.message); }
          finally { submitting.value = false; }
        }

        async function handleCancelLastRun() {

            message.success('已请求取消抢注任务');
            await pollRunStatus();
          } catch (e) { message.error(e.message); }
          finally { canceling.value = false; }
        }

          updateCompactState();
          window.addEventListener('resize', updateCompactState);
          loadAccounts();
        });

          stopRunPolling();
          window.removeEventListener('resize', updateCompactState);
        });

      }

                    </div>
                    <div v-if="item.mode === 'times'">
                      <n-text depth="3" style="font-size:12px">时间</n-text>
                      <n-input v-model:value="item.times_text" size="small" placeholder="9:00AM, 9:00PM" />
                    </div>
                    <div v-else>
                      <n-text depth="3" style="font-size:12px">间隔分钟</n-text>
                      <n-input-number v-model:value="item.interval_minutes" :min="1" :max="1440" :precision="0" size="small" />
                    </div>
                    <div>
                      <n-text depth="3" style="font-size:12px">超时/重试</n-text>
                      <n-space :size="6">
                        <n-input-number v-model:value="item.timeout" :min="1" :max="3600" :precision="0" size="small" placeholder="超时" />
                        <n-input-number v-model:value="item.retries" :min="0" :max="20" :precision="0" size="small" placeholder="重试" />
                        <n-button size="small" text type="error" @click="removeRegistrarSchedule(index)">删除</n-button>
                      </n-space>
                    </div>
                  </div>
                </div>
              </div>
              <n-empty v-else description="暂无定时抢注 Bot" />
              <n-divider />
              <n-space justify="end">
                <n-button :loading="savingAutomation" type="primary" @click="handleSaveAutomation">保存自动化配置</n-button>
              </n-space>
            </div>

            <div class="panel">
              <div class="panel-header">
                <div>
                  <div class="panel-title">备份 / 恢复</div>
                  <div class="panel-desc">下载脱敏诊断快照，或从本地备份恢复配置文件。</div>
                </div>
              </div>
              <div v-if="backups.length" class="data-table-wrap">
                <n-data-table :columns="backupColumns" :data="backups" :bordered="false" size="small" />
              </div>
              <n-empty v-else description="暂无本地备份" />
            </div>

            <div class="panel">
              <div class="panel-header">
                <div>
                  <div class="panel-title">通知</div>
                  <div class="panel-desc">仅使用用户手动配置的 Apprise URI 或 Telegram Bot Token + Chat ID。</div>
                </div>
              </div>
              <n-alert v-if="notifierData && notifierData.configured" type="success" :bordered="false" style="margin-bottom:12px">
                当前目标：{{ notifierData.target_label }}
              </n-alert>
              <n-descriptions label-placement="left" :column="descriptionColumns(2)" bordered>
                <n-descriptions-item label="启用通知">
                  <n-switch v-model:value="notifierForm.enabled" />
                </n-descriptions-item>
                <n-descriptions-item label="方式">
                  <n-select v-model:value="notifierForm.method" :options="[{label:'Telegram',value:'telegram'},{label:'Apprise URI',value:'apprise'}]" size="small" />
                </n-descriptions-item>
                <n-descriptions-item v-if="notifierForm.method === 'telegram'" label="Bot Token">
                  <n-input v-model:value="notifierForm.telegram_bot_token" type="password" show-password-on="click" size="small" placeholder="留空则保留现有 Token" />
                </n-descriptions-item>
                <n-descriptions-item v-if="notifierForm.method === 'telegram'" label="Chat ID">
                  <n-input v-model:value="notifierForm.telegram_chat_id" size="small" placeholder="@channel 或 -100..." />
                </n-descriptions-item>
                <n-descriptions-item v-if="notifierForm.method === 'apprise'" label="Apprise URI">
                  <n-input v-model:value="notifierForm.apprise_uri" type="password" show-password-on="click" size="small" placeholder="留空则保留现有 URI" />
                </n-descriptions-item>
              </n-descriptions>
              <n-divider />
              <n-space justify="end">
                <n-button :loading="testingNotifier" @click="handleTestNotifier">测试发送</n-button>
                <n-button :loading="savingNotifier" type="primary" @click="handleSaveNotifier">保存通知</n-button>
              </n-space>
            </div>
          </n-spin>
        </div>
      `,
      setup() {
        const message = useMessage();
        const configData = ref(null);
        const automationData = ref(null);
        const healthData = ref(null);
        const notifierData = ref(null);
        const backups = ref([]);
        const loading = ref(true);
        const isCompact = ref(window.innerWidth < 760);
        const saving = ref(false);
        const savingAutomation = ref(false);
        const savingNotifier = ref(false);
        const testingNotifier = ref(false);
        const exportingBackup = ref(false);
        const creatingBackup = ref(false);
        const restoringBackup = ref('');
        const editConfig = reactive({
          emby_time_range: '', emby_interval_days: '', emby_concurrency: 1,
          proxy_hostname: '', proxy_port: null, proxy_scheme: null,
        });
        const automationForm = reactive({
          checkiner_sites: [],
          checkiner_time_range: '',
          checkiner_interval_days: '',
          checkiner_timeout: 120,
          checkiner_retries: 4,
          checkiner_concurrency: 1,
          checkiner_random_start: 60,
          registrar_concurrency: 1,
          registrar_schedules: [],
          preserved_registrar_sites: [],
        });
        const notifierForm = reactive({
          enabled: false, method: 'apprise', apprise_uri: '',
          telegram_bot_token: '', telegram_chat_id: '',
        });
        const checkinerSiteOptions = [
          { label: '全部站点', value: 'all' },
        ];
        const registrarModeOptions = [
          { label: '指定时间', value: 'times' },
          { label: '固定间隔', value: 'interval' },
        ];

        function updateCompactState() {
          isCompact.value = window.innerWidth < 760;
        }

        function descriptionColumns(count) {
          return isCompact.value ? 1 : count;
        }

        function formatDate(value) {
          return value ? new Date(value).toLocaleString() : '-';
        }

        const backupColumns = [
          { title: '备份 ID', key: 'id', width: 190 },
          { title: '创建时间', key: 'created_at', render(row) { return formatDate(row.created_at); } },
          { title: '文件', key: 'files', render(row) { return (row.files || []).join(', ') || '-'; } },
          { title: '操作', key: 'actions', width: 100, render(row) {
            return Vue.h(naiveUI.NPopconfirm, { onPositiveClick: () => handleRestoreBackup(row.id) }, {
              trigger: () => Vue.h(naiveUI.NButton, { size: 'small', loading: restoringBackup.value === row.id }, () => '恢复'),
              default: () => `恢复备份 ${row.id}？当前配置会先自动备份。`,
            });
          }},
        ];

        async function loadData() {
          try {
            configData.value = await API.getConfig();
            Object.assign(editConfig, configData.value);
            automationData.value = await API.getAutomationConfig();
            assignAutomationForm(automationData.value);
            healthData.value = await API.getHealth();
            notifierData.value = await API.getNotifier();
            backups.value = await API.listBackups();
            notifierForm.enabled = notifierData.value.enabled;
            notifierForm.method = notifierData.value.method === 'telegram' ? 'telegram' : 'apprise';
            notifierForm.telegram_chat_id = notifierData.value.telegram_chat_id || '';
          } catch (e) { message.error(e.message); }
          finally { loading.value = false; }
        }

        function optionalText(value) {
          const trimmed = typeof value === 'string' ? value.trim() : value;
          return trimmed || null;
        }

        function splitListText(value) {
          if (!value) return [];
          return String(value).split(/[\n,，]+/).map((item) => item.trim()).filter(Boolean);
        }

        function normalizeBotForConfig(value) {
          let bot = optionalText(value) || '';
          bot = bot.replace(/^https?:\/\/t\.me\//i, '').split('?', 1)[0].replace(/^@/, '').replace(/\/+$/, '').trim();
          return bot;
        }

        function assignAutomationForm(data) {
          automationForm.checkiner_sites = [...(data.checkiner_sites || [])];
          automationForm.checkiner_time_range = data.checkiner_time_range || '';
          automationForm.checkiner_interval_days = data.checkiner_interval_days || '';
          automationForm.checkiner_timeout = data.checkiner_timeout || 120;
          automationForm.checkiner_retries = data.checkiner_retries ?? 4;
          automationForm.checkiner_concurrency = data.checkiner_concurrency || 1;
          automationForm.checkiner_random_start = data.checkiner_random_start ?? 60;
          automationForm.registrar_concurrency = data.registrar_concurrency || 1;
          automationForm.preserved_registrar_sites = [...(data.preserved_registrar_sites || [])];
          automationForm.registrar_schedules = (data.registrar_schedules || []).map((item) => ({
            bot_username: item.bot_username || '',
            mode: item.mode || (item.interval_minutes ? 'interval' : 'times'),
            times_text: (item.times || []).join(', '),
            interval_minutes: item.interval_minutes || 5,
            timeout: item.timeout || 120,
            retries: item.retries ?? 1,
          }));
        }

        function addRegistrarSchedule() {
          automationForm.registrar_schedules.push({
            bot_username: '',
            mode: 'times',
            times_text: '9:00AM',
            interval_minutes: 5,
            timeout: 120,
            retries: 1,
          });
        }

        function removeRegistrarSchedule(index) {
          automationForm.registrar_schedules.splice(index, 1);
        }

        function addScheduleText(data, key, value, label) {
          const normalized = optionalText(value);
          if (normalized === null && configData.value && configData.value[key] != null) {
            throw new Error(`${label}不能为空`);
          }
          if (normalized !== null) data[key] = normalized;
        }

        function optionalPositiveInteger(value, label) {
          if (value == null) return null;
          if (!Number.isInteger(value) || value <= 0) {
            throw new Error(`${label}必须是正整数`);
          }
          return value;
        }

        function optionalNonNegativeInteger(value, label) {
          if (value == null) return null;
          if (!Number.isInteger(value) || value < 0) {
            throw new Error(`${label}必须是非负整数`);
          }
          return value;
        }

        async function handleSave() {
          saving.value = true;
          try {
            const data = {
              emby_concurrency: optionalPositiveInteger(editConfig.emby_concurrency, 'Emby 并发数'),
              proxy: {
                hostname: optionalText(editConfig.proxy_hostname),
                port: optionalPositiveInteger(editConfig.proxy_port, '代理端口'),
                scheme: editConfig.proxy_scheme || null,
              },
            };
            addScheduleText(data, 'emby_time_range', editConfig.emby_time_range, 'Emby 时间范围');
            addScheduleText(data, 'emby_interval_days', editConfig.emby_interval_days, 'Emby 间隔天数');
            await API.updateConfig(data);
            message.success('配置已保存');
            await loadData();
          } catch (e) { message.error(e.message); }
          finally { saving.value = false; }
        }

        async function handleSaveAutomation() {
          savingAutomation.value = true;
          try {
            const schedules = automationForm.registrar_schedules.map((item, index) => {
              const bot = normalizeBotForConfig(item.bot_username);
              if (!bot) throw new Error(`第 ${index + 1} 个抢注 Bot 不能为空`);
              const schedule = {
                bot_username: bot,
                mode: item.mode || 'times',
                timeout: optionalPositiveInteger(item.timeout, '抢注超时秒数'),
                retries: optionalNonNegativeInteger(item.retries, '抢注重试次数'),
              };
              if (schedule.mode === 'interval') {
                schedule.interval_minutes = optionalPositiveInteger(item.interval_minutes, '抢注间隔分钟');
              } else {
                const times = splitListText(item.times_text);
                if (!times.length) throw new Error(`第 ${index + 1} 个抢注 Bot 缺少时间`);
                schedule.times = times;
              }
              return schedule;
            });
            await API.updateAutomationConfig({
              checkiner_sites: automationForm.checkiner_sites || [],
              checkiner_time_range: optionalText(automationForm.checkiner_time_range),
              checkiner_interval_days: optionalText(automationForm.checkiner_interval_days),
              checkiner_timeout: optionalPositiveInteger(automationForm.checkiner_timeout, '签到超时秒数'),
              checkiner_retries: optionalNonNegativeInteger(automationForm.checkiner_retries, '签到重试次数'),
              checkiner_concurrency: optionalPositiveInteger(automationForm.checkiner_concurrency, '签到并发数'),
              checkiner_random_start: optionalNonNegativeInteger(automationForm.checkiner_random_start, '随机延迟分钟'),
              registrar_concurrency: optionalPositiveInteger(automationForm.registrar_concurrency, '抢注并发数'),
              registrar_schedules: schedules,
            });
            message.success('自动化配置已保存');
            await loadData();
          } catch (e) { message.error(e.message); }
          finally { savingAutomation.value = false; }
        }

        function notifierPayload() {
          const data = {
            enabled: notifierForm.enabled,
            method: notifierForm.method,
          };
          if (notifierForm.method === 'telegram') {
            const botToken = optionalText(notifierForm.telegram_bot_token);
            const chatId = optionalText(notifierForm.telegram_chat_id);
            const existing = notifierData.value || {};
            const existingChatId = existing.telegram_chat_id || null;
            const existingTelegram = existing.configured && existing.method === 'telegram';
            if (botToken) {
              if (!chatId) throw new Error('Telegram Chat ID 不能为空');
              data.telegram_bot_token = botToken;
              data.telegram_chat_id = chatId;
            } else if (!existingTelegram) {
              throw new Error('配置 Telegram 通知时必须输入 Bot Token 和 Chat ID');
            } else if (chatId && chatId !== existingChatId) {
              throw new Error('修改 Telegram Chat ID 时必须重新输入 Bot Token');
            }
          } else {
            data.apprise_uri = optionalText(notifierForm.apprise_uri);
          }
          return data;
        }

        async function handleSaveNotifier() {
          savingNotifier.value = true;
          try {
            notifierData.value = await API.updateNotifier(notifierPayload());
            message.success('通知配置已保存');
            await loadData();
          } catch (e) { message.error(e.message); }
          finally { savingNotifier.value = false; }
        }

        async function handleTestNotifier() {
          testingNotifier.value = true;
          try {
            await API.testNotifier(notifierPayload());
            message.success('测试通知已发送');
          } catch (e) { message.error(e.message); }
          finally { testingNotifier.value = false; }
        }

        async function handleExportConfig() {
          exportingBackup.value = true;
          try {
            const data = await API.exportConfig();
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            downloadJson(`emby-keeper-redacted-${stamp}.json`, data);
            message.success('脱敏快照已下载');
          } catch (e) { message.error(e.message); }
          finally { exportingBackup.value = false; }
        }

        async function handleCreateBackup() {
          creatingBackup.value = true;
          try {
            const res = await API.backupConfig();
            message.success(`本地备份已创建：${res.backup_dir}`);
            await loadData();
          } catch (e) { message.error(e.message); }
          finally { creatingBackup.value = false; }
        }

        async function handleRestoreBackup(id) {
          restoringBackup.value = id;
          try {
            const res = await API.restoreBackup(id);
            message.success(`已恢复 ${res.restored_files.join(', ')}`);
            await loadData();
          } catch (e) { message.error(e.message); }
          finally { restoringBackup.value = ''; }
        }

        onMounted(() => {
          loadData();
          window.addEventListener('resize', updateCompactState);
        });
        onUnmounted(() => {
          window.removeEventListener('resize', updateCompactState);
        });
        return { configData, automationData, healthData, notifierData, backups, backupColumns, loading, saving, savingAutomation, savingNotifier, testingNotifier, exportingBackup, creatingBackup, restoringBackup, editConfig, automationForm, notifierForm, checkinerSiteOptions, registrarModeOptions, descriptionColumns, loadData, handleSave, handleSaveAutomation, addRegistrarSchedule, removeRegistrarSchedule, handleSaveNotifier, handleTestNotifier, handleExportConfig, handleCreateBackup, handleRestoreBackup };
      }
    };

    // ============ Main App Layout ============
    const AppLayout = {
      components: { NButton, NText },
      template: `
        <div class="app-shell">
          <aside class="sidebar">
            <div class="sidebar-brand">
              <div class="brand-block">
                <span class="header-title">Emby Keeper</span>
                <span class="header-subtitle">运维控制台</span>
              </div>
            </div>
            <nav class="sidebar-nav">
              <n-button text class="nav-button" :class="{ active: isActiveRoute('/') }" @click="$router.push('/')">仪表盘</n-button>
              <n-button text class="nav-button" :class="{ active: isActiveRoute('/schedule') }" @click="$router.push('/schedule')">调度</n-button>
              <n-button text class="nav-button" :class="{ active: isActiveRoute('/runs') }" @click="$router.push('/runs')">运行历史</n-button>
              <n-button text class="nav-button" :class="{ active: isActiveRoute('/registrar') }" @click="$router.push('/registrar')">一键抢注</n-button>
              <n-button text class="nav-button" :class="{ active: isActiveRoute('/config') }" @click="$router.push('/config')">配置</n-button>
            </nav>
            <div class="sidebar-footer">
              <n-button block secondary type="error" @click="handleLogout">退出登录</n-button>
            </div>
          </aside>
          <main class="main-shell">
            <header class="header-bar">
              <div class="mobile-nav">
                <n-button text class="nav-button" :class="{ active: isActiveRoute('/') }" @click="$router.push('/')">仪表盘</n-button>
                <n-button text class="nav-button" :class="{ active: isActiveRoute('/schedule') }" @click="$router.push('/schedule')">调度</n-button>
                <n-button text class="nav-button" :class="{ active: isActiveRoute('/runs') }" @click="$router.push('/runs')">日志</n-button>
                <n-button text class="nav-button" :class="{ active: isActiveRoute('/registrar') }" @click="$router.push('/registrar')">抢注</n-button>
                <n-button text class="nav-button" :class="{ active: isActiveRoute('/config') }" @click="$router.push('/config')">配置</n-button>
              </div>
              <div class="brand-block">
                <n-text class="page-kicker">当前页面</n-text>
                <n-text class="section-title">{{ activeTitle }}</n-text>
              </div>
              <div class="header-actions">
                <n-button size="small" @click="$router.push('/servers/new')">新增服务器</n-button>
                <n-button size="small" secondary type="error" @click="handleLogout">退出</n-button>
              </div>
            </header>
            <router-view />
          </main>
        </div>
      `,
      setup() {
        const router = VueRouter.useRouter();
        const route = VueRouter.useRoute();
        const activeTitle = computed(() => {
          const current = route.path;
          if (current === '/' || current.startsWith('/servers')) return '仪表盘 / 服务器';
          if (current.startsWith('/schedule')) return '调度';
          if (current.startsWith('/runs')) return '运行日志';
          if (current.startsWith('/registrar')) return '一键抢注';
          if (current.startsWith('/config')) return '配置';
          return '控制台';
        });
        function isActiveRoute(path) {
          const current = route.path;
          if (path === '/') return current === '/' || current.startsWith('/servers');
          return current === path || current.startsWith(`${path}/`);
        }
        function handleLogout() {
          sessionStorage.removeItem('ek_jwt');
          router.replace('/login');
        }
        return { activeTitle, isActiveRoute, handleLogout };
      }
    };

    // ============ Vue App & Router ============
    const routes = [
      { path: '/login', component: LoginPage },
      {
        path: '/',
        component: AppLayout,
        children: [
          { path: '', component: DashboardPage },
          { path: 'servers', component: DashboardPage },
          { path: 'servers/new', component: ServerFormPage },
          { path: 'servers/:id', component: ServerDetailPage },
          { path: 'servers/:id/edit', component: ServerFormPage },
          { path: 'schedule', component: SchedulePage },
          { path: 'registrar', component: RegistrarPage },
          { path: 'runs', component: RunHistoryPage },
          { path: 'config', component: ConfigPage },
        ],
      },
    ];

    function directRouteFromPathname() {
      const basePath = typeof window.EK_BASE_PATH === 'string' ? window.EK_BASE_PATH : '';
      let path = window.location.pathname || '/';
      if (basePath && path.startsWith(basePath)) {
        path = path.slice(basePath.length) || '/';
      }
      path = path.replace(/\/$/, '') || '/';
      if (path === '/' || path === '/login' || path === '/schedule' || path === '/runs' || path === '/config' || path === '/registrar') {
        return path;
      }
      if (path === '/servers' || path.startsWith('/servers/')) {
        return path;
      }
      return null;
    }

    function directRouteHashUrl(route) {
      const basePath = typeof window.EK_BASE_PATH === 'string' ? window.EK_BASE_PATH : '';
      const base = basePath || '/';
      return `${base}#${route}`;
    }

    // Capture direct SPA routes before hash history normalizes an empty hash to #/.
    const directRoute = !window.location.hash ? directRouteFromPathname() : null;
    if (directRoute && directRoute !== '/') {
      window.history.replaceState(window.history.state, '', directRouteHashUrl(directRoute));
    }

    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(window.EK_BASE_PATH || '/'),
      routes,
    });

    // Navigation guard: check auth
    router.beforeEach((to, from, next) => {
      const token = sessionStorage.getItem('ek_jwt');
      if (to.path === '/login') {
        next();
      } else if (!token) {
        next('/login');
      } else {
        next();
      }
    });

    if (directRoute && directRoute !== '/') {
      router.replace(directRoute);
    }

    const app = createApp({
      setup() {
        return { zhCN, dateZhCN };
      },
      template: `
        <n-config-provider :theme="null" :locale="zhCN" :date-locale="dateZhCN">
          <n-message-provider>
            <n-notification-provider>
              <n-dialog-provider>
                <router-view />
              </n-dialog-provider>
            </n-notification-provider>
          </n-message-provider>
        </n-config-provider>
      `,
    });
    app.use(router);

    // Register all Naive UI components
    for (const [name, comp] of Object.entries(naiveUI)) {
      if (name.startsWith('N') && comp) {
        app.component(name, comp);
      }
    }

    app.mount('#app');
  </script>
</body>
</html>
